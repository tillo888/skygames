# Free plan: the Analyzer works for everyone, but saved heats are wiped when the
# service restarts or sleeps (free services have no persistent disk).
# To keep saved heats: in Render change the instance type to Starter ($7/mo),
# then uncomment the disk block below and push.
services:
  - type: web
    name: skygames
    runtime: docker
    plan: free
    healthCheckPath: /api/meta
    envVars:
      - key: SKYGAMES_ADMIN_PASSWORD
        sync: false          # Render asks you for it on first deploy
      - key: SKYGAMES_SECRET_KEY
        generateValue: true
      - key: SKYGAMES_HTTPS_ONLY
        value: "1"
      - key: SKYGAMES_DB
        value: /tmp/skygames_web.sqlite
    # disk:
    #   name: skygames-data
    #   mountPath: /data
    #   sizeGB: 1
